<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Weather Forecast</h1>
        <div class="header-actions">
          <button id="unit-toggle" class="pill" type="button" aria-label="Switch temperature unit">°C</button>
          <button id="account-button" class="pill" type="button">Sign in</button>
        </div>
      </header>
      <form id="signin-form" class="panel" hidden>
        <p>Sign in to save your favorite cities. We'll email you a sign-in link — no password needed.</p>
        <div class="row">
          <input id="signin-email" type="email" placeholder="you@example.com" autocomplete="email" required />
          <button class="btn-primary" type="submit">Send link</button>
        </div>
        <p id="signin-status" role="status"></p>
      </form>
      <form id="search-form" class="row">
        <input id="city-input" type="text" placeholder="Enter a city, e.g. Manama" required />
        <button class="btn-primary" type="submit">Search</button>
      </form>
      <p id="status"></p>
      <section id="favorites" hidden>
        <div class="favorites-head">
          <h2>My cities</h2>
          <span class="favorites-user"></span>
        </div>
        <p class="favorites-note"></p>
        <div class="favorites-list"></div>
      </section>
      <section id="empty">
        <div class="empty-icon"></div>
        <p>Search for a city to see its forecast.</p>
      </section>
      <section id="current" hidden></section>
      <section id="forecast"></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
